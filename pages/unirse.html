<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Unirse a colección | BGLike</title>

    <link
        rel="stylesheet"
        href="../css/global.css">

    <link
        rel="stylesheet"
        href="../css/home.css">

</head>

<body>

    <main class="join-page">

        <section class="join-container">

            <a
                href="../index.html"
                class="back-link">
                ← Volver
            </a>


            <header class="join-header">

                <div class="brand-icon">
                    🎲
                </div>

                <h1>
                    Unirse a colección
                </h1>

                <p>
                    Elige quién eres para entrar
                    a la colección.
                </p>

            </header>


            <div class="collection-code-box">

                <span>
                    Código de colección
                </span>

                <strong id="collectionCode">
                    -
                </strong>

            </div>


            <div
                id="joinMessage"
                class="import-message"
                hidden>
            </div>


            <section
                id="usersSection"
                class="users-section"
                hidden>

                <div class="users-header">

                    <h2>
                        ¿Quién eres?
                    </h2>

                    <p>
                        Selecciona tu apodo.
                    </p>

                </div>


                <div
                    id="usersList"
                    class="users-list">
                </div>


                <div
                    id="emptyUsers"
                    class="empty-users"
                    hidden>

                    <span>
                        👋
                    </span>

                    <strong>
                        Todavía no hay apodos
                    </strong>

                    <p>
                        Sé el primero en crear uno.
                    </p>

                </div>


                <button
                    type="button"
                    id="btnShowCreateUser"
                    class="create-user-button">

                    + Crear nuevo apodo

                </button>


                <form
                    id="createUserForm"
                    class="create-user-form"
                    hidden>

                    <label for="nickname">
                        Nuevo apodo
                    </label>

                    <div class="nickname-row">

                        <input
                            type="text"
                            id="nickname"
                            maxlength="50"
                            autocomplete="off"
                            placeholder="Ej. David">

                        <button
                            type="submit"
                            id="btnCreateUser">
                            Crear
                        </button>

                    </div>

                    <span
                        id="nicknameError"
                        class="form-error"
                        aria-live="polite">
                    </span>

                </form>

            </section>

        </section>

    </main>


    <script
        type="module"
        src="../js/pages/join.js">
    </script>

</body>

</html>
